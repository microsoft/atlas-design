name: Visual diff

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-diff-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out proposed merge
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          persist-credentials: false

      - name: Check out exact base
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          path: .visual-diff-base
          persist-credentials: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install proposed-merge dependencies
        run: npm ci

      - name: Install base dependencies
        working-directory: .visual-diff-base
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test visual diff tooling
        run: npm run test:visual-diff -w @microsoft/atlas-integration

      - name: Build base site
        working-directory: .visual-diff-base
        run: |
          npm run build:css
          npm run build:site

      - name: Build proposed-merge site
        run: |
          npm run build:css
          npm run build:site

      - name: Compare static sites
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: node integration/tasks/visual-diff.mjs .visual-diff-base/site/dist site/dist "${{ runner.temp }}/visual-diff-report"

      - name: Upload visual report data
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-diff-report
          path: ${{ runner.temp }}/visual-diff-report
          if-no-files-found: error
          retention-days: 30
