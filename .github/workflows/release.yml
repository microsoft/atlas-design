name: Release

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  release:
    if: github.repository == 'microsoft/atlas-design'
    permissions:
      contents: read
    name: Release
    runs-on: windows-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.ATLAS_CHANGESETS_APP_CLIENT_ID }}
          private-key: ${{ secrets.ATLAS_CHANGESETS_APP_PRIVATE_KEY }}

      # https://github.com/changesets/action
      - name: Create or update Changesets version PR
        uses: changesets/action@v1
        env:
          HOME: ${{ github.workspace }} # https://github.com/changesets/action/issues/147
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
