name: Release

on:
  push:
    branches:
      - main

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  release:
    if: github.repository == 'microsoft/atlas-design'
    permissions:
      contents: read
    name: Release
    runs-on: windows-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.ATLAS_CHANGESETS_APP_CLIENT_ID }}
          private-key: ${{ secrets.ATLAS_CHANGESETS_APP_PRIVATE_KEY }}

      # https://github.com/changesets/action
      - name: Create or update Changesets version PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        env:
          HOME: ${{ github.workspace }} # https://github.com/changesets/action/issues/147
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
