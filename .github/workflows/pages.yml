name: Publish documentation and visual reports

on:
  workflow_run:
    workflows: ['Ensure build, lint, and test', 'Visual diff']
    types: [completed]
  pull_request_target:
    branches: [main]
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
  pull-requests: write

# Every publication reconstructs the whole site from current artifacts.
# Serializing all deployments prevents documentation and PR reports overwriting each other.
concurrency:
  group: atlas-pages
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.name == 'Visual diff' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Never check out PR code in this privileged workflow, including on workflow_run.
      - name: Check out trusted publisher
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Assemble documentation and current PR reports
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_OUTPUT: ${{ runner.temp }}/atlas-pages
          REPORT_LINKS_FILE: ${{ runner.temp }}/visual-report-links.json
        run: node integration/tasks/publish-visual-diff.mjs

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ${{ runner.temp }}/atlas-pages

      - name: Deploy documentation and reports
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Post report links after deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT_LINKS_FILE: ${{ runner.temp }}/visual-report-links.json
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: node integration/tasks/publish-visual-diff.mjs --comment
